<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ベビー価格ウォッチ">
<meta name="theme-color" content="#f6f3ee">
<meta name="app-version" content="6.0-dev">
<title>ベビー価格ウォッチ</title>
<style>
:root{--bg:#f6f3ee;--card:#fff;--text:#27231f;--muted:#746f68;--line:#e3ddd4;--accent:#5a5148;--soft:#f0ebe4;--good:#287047;--goodbg:#e9f5ed;--warn:#94610c;--warnbg:#fff4da}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic",sans-serif}
button{font:inherit;border:0;border-radius:12px;padding:11px 14px;cursor:pointer}.wrap{max-width:980px;margin:auto;padding:16px 12px 34px}
header{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:14px}h1{font-size:25px;margin:0 0 4px}.sub,.small{font-size:12px;color:var(--muted);line-height:1.5}
.primary{background:var(--accent);color:#fff}.secondary{background:var(--soft);color:var(--text)}.ghost{background:white;border:1px solid var(--line)}
.status{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:12px;margin-bottom:12px;display:flex;justify-content:space-between;gap:10px;align-items:center}.ok{color:var(--good)}.warn{color:var(--warn)}
.mode{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:12px;margin-bottom:12px}.switch{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}.switch button.active{background:var(--accent);color:white}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.product{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:14px}.product h2{font-size:17px;margin:0 0 3px}.jan{font-size:11px;color:var(--muted);margin-bottom:12px}
.price{font-size:27px;font-weight:850;letter-spacing:-.03em}.label{font-size:11px;color:var(--muted)}.row{display:flex;justify-content:space-between;gap:10px;align-items:flex-end}.chips{display:flex;gap:5px;flex-wrap:wrap;margin-top:9px}.chip{font-size:10px;padding:4px 7px;border-radius:999px;background:var(--soft)}.best{background:var(--goodbg);color:var(--good);font-weight:800}.history{margin-top:11px;border-top:1px solid var(--line);padding-top:10px}.shop{font-weight:750}.link{display:inline-block;margin-top:10px;color:inherit;text-decoration:underline;text-underline-offset:3px}
.empty{padding:28px 8px;text-align:center;color:var(--muted)}.footer{margin-top:18px;font-size:11px;color:var(--muted);line-height:1.55}
@media(max-width:700px){header{display:block}header .actions{margin-top:9px}.grid{grid-template-columns:1fr}.switch button{flex:1}.status{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div>
    <h1>ベビー価格ウォッチ</h1>
    <div class="sub">4商品を固定監視。取得できた販売先から、その時点の最安を自動比較します。</div>
  </div>
  <div class="actions"><button class="primary" id="refreshBtn">今すぐ価格チェック</button></div>
</header>

<div class="status">
  <div><b id="statusTitle">バックエンド未接続</b><div class="small" id="statusText">Supabase設定後、自動監視が有効になります。</div></div>
  <div class="small" id="lastChecked">最終確認：—</div>
</div>

<div class="mode">
  <b>実質最安の見方</b>
  <div class="switch">
    <button class="modeBtn secondary" data-mode="cash">現金支払額</button>
    <button class="modeBtn secondary active" data-mode="normal">通常ポイント込み</button>
    <button class="modeBtn secondary" data-mode="all">取得できた全ポイント込み</button>
  </div>
  <div class="small" id="modeHelp" style="margin-top:7px">通常ポイントだけを1pt=1円として差し引きます。</div>
</div>

<div id="products" class="grid"></div>
<div class="footer">
  ※「全ポイント込み」はAPIから取得できたポイントのみ。Yahoo!ショッピング等のログイン状態・会員ランク・個別キャンペーンによる還元は、公式APIで取得できない場合があります。<br>
  ※「最安」は監視対象サービスから取得できた新品・在庫あり候補の中での最安です。
</div>
</div>

<script src="config.js"></script>
<script>
const PRODUCTS=[
 {id:"culmove-js-black",name:"クルムーヴ コンパクト JS（黒）",jan:"4972990196710",category:"チャイルドシート"},
 {id:"culmove-js-brown",name:"クルムーヴ コンパクト JS（茶）",jan:"4972990196727",category:"チャイルドシート"},
 {id:"luxuna-air-plus-blue",name:"ラクーナ エアー プラス（青）",jan:"4969220010212",category:"ベビーカー"},
 {id:"laclis-ab-black",name:"ラクリス AB（黒）",jan:"4969220010663",category:"抱っこ紐"}
];
const cfg=window.PRICE_WATCH_CONFIG||{};
let mode=localStorage.getItem("priceWatchMode")||"normal";
let state={products:[]};
const $=x=>document.getElementById(x);
const yen=n=>Number.isFinite(Number(n))?Math.round(Number(n)).toLocaleString("ja-JP")+"円":"—";
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
function effective(o){if(!o)return null;if(mode==="cash")return Number(o.cash_total);if(mode==="all")return Number(o.effective_all);return Number(o.effective_normal)}
function setMode(m){mode=m;localStorage.setItem("priceWatchMode",m);document.querySelectorAll(".modeBtn").forEach(b=>b.classList.toggle("active",b.dataset.mode===m));$("modeHelp").textContent=m==="cash"?"ポイントを考慮せず、商品価格＋送料で比較します。":m==="all"?"APIで取得できた通常＋限定ポイントを差し引いて比較します。":"通常ポイントだけを1pt=1円として差し引きます。";render()}
function fallback(){return PRODUCTS.map(p=>({...p,offers:[],current:null,history_low:null,last_checked_at:null}))}
function render(){
 const map=new Map((state.products||[]).map(p=>[p.id,p]));
 const list=PRODUCTS.map(base=>({...base,...(map.get(base.id)||{}),offers:(map.get(base.id)?.offers||[])}));
 $("products").innerHTML=list.map(p=>{
   const offers=[...p.offers].sort((a,b)=>(effective(a)??Infinity)-(effective(b)??Infinity));
   const best=offers[0];
   const hist=mode==="cash"?p.history_low_cash:mode==="all"?p.history_low_all:p.history_low_normal;
   return '<section class="product">'+
     '<h2>'+esc(p.name)+'</h2><div class="jan">JAN '+esc(p.jan)+'</div>'+
     (best?'<div class="row"><div><div class="label">現在の最安</div><div class="price">'+yen(effective(best))+'</div></div><div style="text-align:right"><div class="label">販売店</div><div class="shop">'+esc(best.store_name)+'</div></div></div>'+
       '<div class="chips"><span class="chip best">'+esc(best.provider)+'</span><span class="chip">本体 '+yen(best.price)+'</span><span class="chip">送料 '+yen(best.shipping||0)+'</span><span class="chip">通常 '+Math.round(best.normal_points||0).toLocaleString()+'pt</span><span class="chip">限定 '+Math.round(best.limited_points||0).toLocaleString()+'pt</span></div>'+
       '<div class="history"><div class="small">過去最安 '+yen(hist)+' ・ '+(p.last_checked_at?'最終確認 '+new Date(p.last_checked_at).toLocaleString("ja-JP"):'未確認')+'</div></div>'+
       (best.url?'<a class="link" href="'+esc(best.url)+'" target="_blank" rel="noopener">この販売先を開く</a>':'')
     :'<div class="empty">まだ価格データがありません。</div>')+
   '</section>'
 }).join("");
 const dates=list.map(x=>x.last_checked_at).filter(Boolean).sort();
 $("lastChecked").textContent="最終確認："+(dates.length?new Date(dates[dates.length-1]).toLocaleString("ja-JP"):"—");
}
async function api(path,opts={}){
 if(!cfg.apiBase)throw new Error("backend-not-configured");
 const url=cfg.apiBase.replace(/\/$/,"")+"/"+path.replace(/^\//,"");
 const headers={"Content-Type":"application/json",...(opts.headers||{})};
 if(cfg.refreshToken)headers["X-Price-Watch-Token"]=cfg.refreshToken;
 const res=await fetch(url,{...opts,headers,cache:"no-store"});
 if(!res.ok)throw new Error("HTTP "+res.status);
 return await res.json();
}
async function loadLatest(){
 try{
   $("statusTitle").textContent="価格データを読み込み中…";$("statusText").textContent="";
   const data=await api("latest");
   state={products:data.products||fallback()};
   $("statusTitle").textContent="自動監視中";$("statusTitle").className="ok";
   const ps=data.providers_configured||{}; const providers=[ps.yahoo?"Yahoo!○":"Yahoo!未設定",ps.rakuten?"楽天○":"楽天未設定"].join(" / "); $("statusText").textContent=(data.schedule_label||"定期チェック設定済み")+" ・ "+providers;
 }catch(e){
   state={products:fallback()};
   $("statusTitle").textContent=cfg.apiBase?"接続エラー":"バックエンド未接続";
   $("statusTitle").className="warn";
   $("statusText").textContent=cfg.apiBase?"Supabase APIに接続できませんでした。":"Supabase設定後、自動監視が有効になります。";
 }
 render();
}
async function refreshNow(){
 const b=$("refreshBtn"),old=b.textContent;b.disabled=true;b.textContent="チェック中…";
 try{await api("refresh",{method:"POST",body:"{}"});await loadLatest()}
 catch(e){alert(e.message==="backend-not-configured"?"Supabaseバックエンドがまだ未設定です。":"価格チェックに失敗しました。")}
 finally{b.disabled=false;b.textContent=old}
}
document.querySelectorAll(".modeBtn").forEach(b=>b.onclick=()=>setMode(b.dataset.mode));
$("refreshBtn").onclick=refreshNow;
setMode(mode);loadLatest();
</script>
</body>
</html>
